// Opt-in host test runner. Invoke with -I gradle/host-tests.gradle.
allprojects { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            def android = project.extensions.getByName('android')
            android.sourceSets.test.java.srcDir(project.file('src/androidTest/java'))
            android.testOptions.unitTests.includeAndroidResources = true
            android.testOptions.unitTests.all {
                systemProperty 'robolectric.enabledSdks', '35'
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                def localJars = project.providers.gradleProperty('robolectricJarDir').orNull
                if (localJars) systemProperty 'robolectric.dependency.dir', localJars
                maxHeapSize = '1g'
            }
            project.dependencies {
                testImplementation(platform('androidx.compose:compose-bom:2024.12.01'))
                testImplementation('androidx.compose.ui:ui-test-junit4')
                testImplementation('androidx.test.ext:junit:1.2.1')
                testImplementation('androidx.test:runner:1.6.2')
                testImplementation('org.robolectric:robolectric:4.14.1')
            }
        }
    }
}
